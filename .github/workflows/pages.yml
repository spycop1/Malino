name: MALINO MagicPad veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Öffentliche Supabase-Konfiguration schreiben
        env:
          MALINO_SUPABASE_URL: ${{ vars.MALINO_SUPABASE_URL }}
          MALINO_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MALINO_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/write-config.mjs
      - name: Projekt prüfen
        run: npm test
      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5
      - name: Webapp bereitstellen
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
